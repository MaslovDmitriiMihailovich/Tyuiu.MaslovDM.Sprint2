name: Mirror to GitVerse

on:
  push:
    branches:
      - master  
  workflow_dispatch:

jobs:
  mirror:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Push to GitVerse
        env:
          GITVERSE_TOKEN: ${{ secrets.GITVERSE_TOKEN }}
        run: |
          git remote add gitverse https://MaslovDM:${{ secrets.GITVERSE_TOKEN }}@gitverse.ru/MaslovDM/Tyuiu.MaslovDM.Sprint2.git
          git push --all --force gitverse
          git push --tags --force gitverse
